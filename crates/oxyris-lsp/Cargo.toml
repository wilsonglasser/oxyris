[package]
name = "oxyris-lsp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
description = "Generic Language Server Protocol client used by the Oxyris MCP server to bridge per-language LSP servers (rust-analyzer, typescript-language-server, intelephense, ...) into MCP tools."

[dependencies]
