[package]
name = "oxyris-desktop"
version = "0.4.17"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
description = "Oxyris desktop backend (Tauri)"

[lib]
name = "oxyris_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "oxyris-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { workspace = true }
tauri-plugin-dialog.workspace = true
tauri-plugin-updater.workspace = true
tauri-plugin-opener.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
uuid.workspace = true
oxyris-core.workspace = true
oxyris-git.workspace = true
oxyris-index.workspace = true
oxyris-ipc.workspace = true
oxyris-lsp.workspace = true
oxyris-procutil.workspace = true
oxyris-provider.workspace = true
oxyris-claude.workspace = true
oxyris-supervisor.workspace = true
oxyris-watch.workspace = true
oxyris-browser.workspace = true
async-trait.workspace = true
ignore.workspace = true
regex.workspace = true
notify.workspace = true
rusqlite.workspace = true
encoding_rs.workspace = true
git2.workspace = true
which.workspace = true
portable-pty.workspace = true
base64 = "0.22"
reqwest = { workspace = true, features = ["json"] }
flate2.workspace = true
futures-util.workspace = true
zip.workspace = true
# Mobile-takeover companion server: a LAN HTTP/WS bridge that mirrors a pure
# session's PTY to a phone. axum for routing + WebSocket, tower-http to serve
# the static mobile UI, qrcode to render the pairing QR, getrandom for the
# unguessable pairing token.
axum = { version = "0.7", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
# Self-signed cert generated at start so the LAN server can serve HTTPS — a
# secure context is required for the phone's mic (Web Speech API). `ring` is the
# rustls crypto provider (no C toolchain needed, unlike aws-lc-rs on Windows).
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
getrandom = "0.2"

[dev-dependencies]
tempfile = "3.16"
