[package]
name = "oxyris-mcp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
description = "MCP (Model Context Protocol) server exposing Oxyris's per-worktree symbol index over JSON-RPC 2.0 / stdio so Claude Code (and other MCP clients) can query it as tools."

[[bin]]
name = "oxyris-mcp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
tracing.workspace = true
tracing-subscriber.workspace = true

oxyris-index.workspace = true
oxyris-laravel.workspace = true
oxyris-lsp.workspace = true

[dev-dependencies]
tempfile = "3.16"
