name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (fmt + clippy + build + test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Stub WSL agent binary
        # `tauri.conf.json#bundle.resources` lists `dist/agent/oxyris-agent`,
        # which `tauri-build` validates at compile time. Regular CI doesn't
        # cross-compile the real agent (that's the release pipeline) — drop
        # an empty placeholder so the build proceeds.
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/agent | Out-Null
          New-Item -ItemType File -Force -Path dist/agent/oxyris-agent | Out-Null

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo build
        run: cargo build --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace

  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
