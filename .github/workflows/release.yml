name: Release

# Triggers on tag pushes shaped like `v0.1.0`. Manual `workflow_dispatch`
# is handy for dry-runs against a non-tagged commit (no release will be
# published in that mode).
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # 1) Cross-compile the WSL agent (Linux x86_64-musl, fully static)
  #    on Ubuntu — far less painful than musl-from-Windows. Upload the
  #    binary as an artifact for the Windows job to consume.
  build-agent:
    name: Build WSL agent (linux musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: agent-musl

      - name: Build oxyris-agent
        run: cargo build -p oxyris-agent --release --target x86_64-unknown-linux-musl

      - name: Stage artifact
        run: |
          mkdir -p dist/agent
          cp target/x86_64-unknown-linux-musl/release/oxyris-agent dist/agent/oxyris-agent
          chmod +x dist/agent/oxyris-agent

      - uses: actions/upload-artifact@v4
        with:
          name: oxyris-agent-linux-musl
          path: dist/agent/oxyris-agent
          if-no-files-found: error
          retention-days: 7

  # 2) Build the Windows desktop app + bundle the agent into the MSI / NSIS
  #    installers via `tauri.conf.json#bundle.resources`. Publishes a
  #    GitHub release on tag pushes.
  build-windows:
    name: Build Windows installer
    needs: build-agent
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-tauri

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install web deps
        run: bun install --frozen-lockfile

      - name: Download agent
        uses: actions/download-artifact@v4
        with:
          name: oxyris-agent-linux-musl
          path: dist/agent

      - name: Build web bundle
        run: bun run --cwd apps/web build

      - name: Build desktop (release + bundle)
        run: bun x tauri build
        env:
          # Updater signing keys (minisign keypair generated via
          # `bun x tauri signer generate`). Public key lives in
          # `tauri.conf.json#plugins.updater.pubkey`; private key +
          # optional password are GH repo secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect installers + build updater manifest
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          # Cargo workspace puts the build dir at the repo root, not under
          # `apps/desktop/target/`. With `bundle.createUpdaterArtifacts` on,
          # tauri build emits a `.sig` next to each installer.
          $bundleDir = "target/release/bundle"
          $patterns = @("msi/*.msi", "msi/*.msi.sig", "nsis/*.exe", "nsis/*.exe.sig")
          foreach ($pat in $patterns) {
              Get-ChildItem -Path (Join-Path $bundleDir $pat) -ErrorAction SilentlyContinue |
                  ForEach-Object { Copy-Item -Force $_.FullName -Destination release }
          }
          if ((Get-ChildItem release -ErrorAction SilentlyContinue).Count -eq 0) {
              Write-Error "No installers were produced — see the build step above."
          }

          # `tauri build` emits only the per-installer .sig files; the updater
          # manifest (latest.json) is ours to assemble. The Windows updater
          # installs through the NSIS setup, so the platform entry points there.
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $repo = "${{ github.repository }}"
          $setup = Get-ChildItem release -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $setup) {
              Write-Error "no NSIS -setup.exe produced; cannot build latest.json"
          }
          $sigPath = Join-Path release "$($setup.Name).sig"
          if (-not (Test-Path $sigPath)) {
              Write-Error "missing $($setup.Name).sig — is bundle.createUpdaterArtifacts enabled?"
          }
          $signature = (Get-Content $sigPath -Raw).Trim()
          $url = "https://github.com/$repo/releases/download/$tag/$($setup.Name)"
          $manifest = [ordered]@{
              version   = $version
              pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
              platforms = [ordered]@{
                  "windows-x86_64" = [ordered]@{ signature = $signature; url = $url }
              }
          }
          $manifest | ConvertTo-Json -Depth 5 |
              Set-Content -Path (Join-Path release "latest.json") -Encoding utf8
          Get-ChildItem release | ForEach-Object { Write-Host "  - $($_.Name)" }

      - name: Upload installers (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: oxyris-windows-installers
          path: release/*

      # Only publish to a Release when the run was triggered by a tag.
      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
